{% extends 'base.html' %}
{% block title %}Ganti Password{% endblock %}
{% block page_title %}Ganti Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header py-3"><h6>Ganti Password</h6></div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Password Lama</label>
            <input type="password" name="password_lama" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password Baru</label>
            <input type="password" name="password_baru" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Konfirmasi Password Baru</label>
            <input type="password" name="konfirmasi" class="form-control" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-bps">Simpan Password</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">Batal</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
