<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SIEMIR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0A2560 0%, #1341A0 50%, #1B52C4 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-wrap {
      width: 100%; max-width: 420px; padding: 16px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(10,37,96,0.35);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #0A2560, #1B52C4);
      padding: 36px 36px 28px;
      text-align: center;
      color: #fff;
    }
    .brand-icon-lg {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.15);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 14px;
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .brand-name-lg {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .brand-sub-lg { font-size: 12.5px; opacity: 0.75; }
    .login-body { padding: 32px 36px; }
    .login-body h5 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #0A2560;
      margin-bottom: 24px;
      text-align: center;
    }
    .form-label { font-size: 13px; font-weight: 500; color: #374151; }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #D1DAF0;
      font-size: 14px;
      padding: 10px 14px;
      transition: all .2s;
    }
    .form-control:focus {
      border-color: #1341A0;
      box-shadow: 0 0 0 3px rgba(19,65,160,0.12);
    }
    .btn-login {
      background: linear-gradient(135deg, #1341A0, #1B52C4);
      color: #fff; border: none;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700; font-size: 15px;
      padding: 12px;
      width: 100%;
      transition: all .2s;
      letter-spacing: 0.3px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0A2560, #1341A0);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(19,65,160,0.3);
    }
    .login-footer {
      text-align: center;
      font-size: 11.5px;
      color: #94A3B8;
      padding: 0 36px 24px;
    }
    .input-group-text {
      border-radius: 0 10px 10px 0;
      border: 1.5px solid #D1DAF0;
      border-left: none;
      background: #F8FAFC;
      color: #94A3B8;
      cursor: pointer;
    }
    .input-group .form-control { border-radius: 10px 0 0 10px; }
    .alert { border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon-lg"><i class="bi bi-database-fill-gear"></i></div>
      <div class="brand-name-lg">SIEMIR</div>
      <div class="brand-sub-lg">Sistem Entri Mitra Rutinan<br>BPS Kabupaten Kepulauan Meranti</div>
    </div>
    <div class="login-body">
      <h5>Masuk ke Sistem</h5>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} mb-3">
            <i class="bi bi-exclamation-circle me-2"></i>{{ msg }}
          </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control"
                 placeholder="Masukkan username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" name="password" id="inp-pw"
                   class="form-control" placeholder="Masukkan password" required>
            <span class="input-group-text" onclick="togglePw()">
              <i class="bi bi-eye" id="ico-pw"></i>
            </span>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
        </button>
      </form>
    </div>
    <div class="login-footer">
      &copy; 2026 SIEMIR &middot; BPS Kabupaten Kepulauan Meranti
    </div>
  </div>
</div>
<script>
function togglePw() {
  const inp = document.getElementById('inp-pw');
  const ico = document.getElementById('ico-pw');
  if (inp.type === 'password') {
    inp.type = 'text'; ico.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password'; ico.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>
